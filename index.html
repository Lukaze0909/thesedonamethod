<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>释放</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e; --bg2: #181818; --bg3: #222;
    --text: #e8e8e4; --text2: #999; --text3: #555;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --accent: #c8b89a; --radius: 12px; --radius-sm: 8px;
  }
  html { background: var(--bg); color: var(--text); font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif; font-size: 16px; line-height: 1.7; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
</style>
</head>

<body>

<script>
// ✅ 已修复这里的字符串错误（这是你白屏的原因）

const reminders = [
  { text: `所有感受都不过"三大想要"。` },
  { text: `记得保持轻松的心态，不要把释放变成另一个"应该"。` },
  { text: "允许一切如其所是。" },
  { text: "你不需要控制，只需要允许。" }
];

// 简单渲染（确保页面一定有内容）
document.body.innerHTML = `
  <div style="padding:40px; font-size:20px;">
    <h1>释放练习</h1>
    <ul>
      ${reminders.map(r => `<li>${r.text}</li>`).join("")}
    </ul>
  </div>
`;

</script>

</body>
</html>
