<script>
let round = 1;

function nextRound() {
  round++;

  const container = document.getElementById("flow");

  const block = document.createElement("div");
  block.className = "round";

  block.innerHTML = `
    <div class="question">第 ${round} 轮</div>

    <div class="question">你是否允许这个感受存在？</div>
    <button onclick="stepDone()">可以</button>
    <button onclick="stepDone()">还不行，但我愿意尝试</button>

    <div class="question">你是否可以释放它？</div>
    <button onclick="stepDone()">可以</button>
    <button onclick="stepDone()">不确定</button>

    <div class="question">你是否愿意释放它？</div>
    <button onclick="stepDone()">我愿意</button>

    <div class="question">现在可以放下了吗？</div>
    <button onclick="finish(true)">可以了</button>
    <button onclick="finish(false)">还没有</button>
  `;

  container.appendChild(block);
}

function stepDone() {
  // 只是占位，你可以加动画/反馈
}

function finish(released) {
  if (released) {
    alert("很好，这一轮你真的放下了一些。你会越来越轻松。");
  } else {
    nextRound(); // 🔥关键：进入下一轮
  }
}
</script>
