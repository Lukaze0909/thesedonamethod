<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>释放</title>

<style>
body {
  background:#0b0b0b;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}

.card {
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
  margin-top:20px;
}

button {
  width:100%;
  margin-top:10px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#c8b79d;
  font-size:16px;
}

.msg {
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>释放</h1>

<div class="card">
  <button onclick="start()">开始释放</button>
</div>

<div id="chat"></div>

<script>

let stepIndex = 0;

const steps = [
  {
    q: "👉 允许这个感受存在吗？",
    a: ["可以", "我愿意尝试"]
  },
  {
    q: "👉 可以释放它吗？",
    a: ["可以", "不确定"]
  },
  {
    q: "👉 愿意释放它吗？",
    a: ["我愿意"]
  },
  {
    q: "👉 现在可以放下了吗？",
    a: ["可以了", "还没有"]
  }
];

function start(){
  document.getElementById("chat").innerHTML = "";
  stepIndex = 0;
  nextStep();
}

function nextStep(){
  if(stepIndex >= steps.length){
    showDone();
    return;
  }

  const step = steps[stepIndex];

  const div = document.createElement("div");
  div.className = "msg";

  let html = `<div>${step.q}</div>`;

  step.a.forEach(text=>{
    html += `<button onclick="choose('${text}')">${text}</button>`;
  });

  div.innerHTML = html;
  document.getElementById("chat").appendChild(div);

  window.scrollTo(0, document.body.scrollHeight);
}

function choose(answer){
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = "👉 你选择了：" + answer;
  document.getElementById("chat").appendChild(div);

  // 如果选择“还没有” → 重来
  if(answer === "还没有"){
    stepIndex = 0;
  }else{
    stepIndex++;
  }

  nextStep();
}

function showDone(){
  const div = document.createElement("div");
  div.className = "msg";
  div.innerHTML = "✨ 很棒。你已经在释放了。";
  document.getElementById("chat").appendChild(div);
}

</script>

</body>
</html>
